<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Presentation</title>


<!-- =========================
     OPEN GRAPH
     ========================= -->

<meta property="og:type"
      content="website">

<meta property="og:title"
      content="Presentation">

<meta property="og:description"
      content="Presentation slides">

<meta property="og:image"
      content="b.png">

<meta property="og:image:type"
      content="image/png">

<meta property="og:image:width"
      content="1200">

<meta property="og:image:height"
      content="675">


<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #000;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   LOADER
   ========================================================= */

#loader {

    position: fixed;

    inset: 0;

    z-index: 9999;

    background: #000;

    color: #fff;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 25px;
}


#loaderText {

    font-size:
        clamp(20px, 4vw, 34px);

    margin-bottom: 22px;

    font-weight: 500;
}


#progress {

    width:
        min(520px, 78vw);

    height: 7px;

    background: #292929;

    border-radius: 20px;

    overflow: hidden;
}


#progressBar {

    width: 0%;

    height: 100%;

    background: #fff;

    border-radius: inherit;

    transition:
        width .15s ease;
}


#progressText {

    margin-top: 13px;

    color: #999;

    font-size: 14px;

    max-width: 90vw;

    line-height: 1.5;
}


/* =========================================================
   ERROR
   ========================================================= */

#errorBox {

    display: none;

    margin-top: 22px;

    max-width: 600px;

    color: #ffb3b3;

    font-size: 14px;

    line-height: 1.6;
}


/* =========================================================
   PRESENTATION
   ========================================================= */

#presentation {

    position: fixed;

    inset: 0;

    background: #000;

    display: none;

    align-items: center;

    justify-content: center;
}


#slideArea {

    position: relative;

    width: 100vw;

    height: 100vh;

    background: #000;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   SLIDES
   ========================================================= */

.slide {

    position: absolute;

    display: none;

    max-width: 100vw;

    max-height: 100vh;

    width: auto;

    height: auto;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    background: #000;
}


.slide.active {

    display: block;
}


/*
   PDF canvas

   Keep the complete page visible.
*/

canvas.slide {

    max-width: 100vw;

    max-height: 100vh;

    width: auto;

    height: auto;

    object-fit: contain;
}


/* =========================================================
   NAVIGATION BUTTONS
   ========================================================= */

.navButton {

    position: fixed;

    bottom: 20px;

    width: 55px;

    height: 55px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,.16);

    color: #fff;

    font-size: 32px;

    line-height: 55px;

    padding: 0;

    cursor: pointer;

    z-index: 100;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    opacity: .55;

    transition:
        opacity .2s ease,
        background .2s ease,
        transform .12s ease;
}


.navButton:hover {

    opacity: 1;

    background:
        rgba(255,255,255,.28);
}


.navButton:active {

    transform:
        scale(.88);
}


#prev {

    left: 20px;
}


#next {

    right: 20px;
}


/* =========================================================
   FULLSCREEN
   ========================================================= */

#fullscreen {

    position: fixed;

    top: 15px;

    right: 15px;

    width: 44px;

    height: 44px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,.15);

    color: #fff;

    font-size: 22px;

    cursor: pointer;

    z-index: 100;

    opacity: .45;

    transition:
        opacity .2s ease,
        transform .15s ease;
}


#fullscreen:hover {

    opacity: 1;
}


#fullscreen:active {

    transform: scale(.88);
}


/* =========================================================
   COUNTER
   ========================================================= */

#counter {

    position: fixed;

    left: 50%;

    bottom: 9px;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.55);

    font-size: 12px;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   ROTATE WARNING
   ========================================================= */

#rotateWarning {

    position: fixed;

    inset: 0;

    z-index: 10000;

    background: #000;

    color: #fff;

    display: none;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;
}


.rotateBox {

    max-width: 500px;
}


#rotateIcon {

    font-size: 70px;

    margin-bottom: 20px;

    animation:
        rotateDevice 2s
        ease-in-out
        infinite;
}


@keyframes rotateDevice {

    0% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(90deg);
    }

    100% {
        transform: rotate(0deg);
    }
}


.rotateBox h2 {

    margin: 0 0 12px;

    font-size: 26px;
}


.rotateBox p {

    margin: 0;

    color: #999;

    line-height: 1.6;
}


/* =========================================================
   PORTRAIT
   ========================================================= */

@media (orientation: portrait) {

    #presentation {

        display: none !important;
    }

    #rotateWarning {

        display: flex;
    }
}


/* =========================================================
   LANDSCAPE
   ========================================================= */

@media (orientation: landscape) {

    #rotateWarning {

        display: none !important;
    }
}


/* =========================================================
   SMALL SCREEN
   ========================================================= */

@media (max-height: 500px) {

    .navButton {

        width: 43px;

        height: 43px;

        line-height: 43px;

        font-size: 24px;

        bottom: 10px;
    }

    #prev {

        left: 10px;
    }

    #next {

        right: 10px;
    }

    #fullscreen {

        width: 38px;

        height: 38px;

        top: 9px;

        right: 9px;

        font-size: 18px;
    }
}


/* =========================================================
   VERY SMALL WIDTH
   ========================================================= */

@media (max-width: 450px) {

    .navButton {

        width: 48px;

        height: 48px;

        line-height: 48px;

        font-size: 27px;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     LOADING SCREEN
     ======================================================= -->

<div id="loader">

    <div id="loaderText">
        Loading presentation…
    </div>

    <div id="progress">

        <div id="progressBar"></div>

    </div>

    <div id="progressText">
        Please wait…
    </div>

    <div id="errorBox"></div>

</div>



<!-- =======================================================
     ROTATE WARNING
     ======================================================= -->

<div id="rotateWarning">

    <div class="rotateBox">

        <div id="rotateIcon">
            ⟳
        </div>

        <h2>
            Landscape mode required
        </h2>

        <p>
            Please rotate your device to landscape mode.
            This presentation is designed for landscape
            screens.
        </p>

    </div>

</div>



<!-- =======================================================
     PRESENTATION
     ======================================================= -->

<div id="presentation">


    <div id="slideArea">


        <!--
             COVER IMAGE

             This is always the first slide.
             It will NEVER be cropped.
        -->

        <img
            id="firstSlide"
            class="slide"
            src="./b.png"
            alt="Presentation cover"
            draggable="false"
        >


        <!--
             PDF canvases will be inserted here.
        -->


    </div>



    <!-- PREVIOUS -->

    <button
        id="prev"
        class="navButton"
        aria-label="Previous slide">

        ‹

    </button>



    <!-- NEXT -->

    <button
        id="next"
        class="navButton"
        aria-label="Next slide">

        ›

    </button>



    <!-- FULLSCREEN -->

    <button
        id="fullscreen"
        aria-label="Fullscreen">

        ⛶

    </button>



    <!-- COUNTER -->

    <div id="counter"></div>


</div>



<!-- =======================================================
     PDF.JS
     ======================================================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
    type="module">
</script>



<script type="module">


/* =========================================================
   CONFIG
   ========================================================= */


/*
   IMPORTANT:

   slide.pdf is in the SAME folder as index.html.

   Therefore we use:

       ./slide.pdf

   NOT a GitHub webpage URL.
*/

const PDF_URL = "slide.pdf";


/*
   Cover image.
*/

const COVER_URL = "b.png";


/*
   IndexedDB settings.
*/

const DB_NAME =
    "PresentationCache";

const DB_VERSION = 1;

const STORE_NAME =
    "files";


/*
   Cache version.

   Change this to v2, v3 etc.
   whenever you replace the PDF and want
   every user to download the new one.
*/

const CACHE_VERSION =
    "presentation_v1";


const CACHE_KEY =
    "presentation_pdf_version";


/* =========================================================
   ELEMENTS
   ========================================================= */

const loader =
    document.getElementById("loader");

const loaderText =
    document.getElementById("loaderText");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const errorBox =
    document.getElementById("errorBox");

const presentation =
    document.getElementById("presentation");

const slideArea =
    document.getElementById("slideArea");

const firstSlide =
    document.getElementById("firstSlide");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

const fullscreenButton =
    document.getElementById("fullscreen");

const counter =
    document.getElementById("counter");


/* =========================================================
   PDF.JS
   ========================================================= */

const pdfjsLib = await import(
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
);


pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =========================================================
   INDEXED DB
   ========================================================= */

function openDB() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                () => {

                    const db =
                        request.result;


                    if (
                        !db.objectStoreNames
                            .contains(STORE_NAME)
                    ) {

                        db.createObjectStore(
                            STORE_NAME
                        );

                    }

                };


            request.onsuccess =
                () => {

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =========================================================
   SAVE PDF
   ========================================================= */

async function savePDF(blob) {

    const db =
        await openDB();


    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            store.put(
                blob,
                PDF_URL
            );


            transaction.oncomplete =
                () => {

                    resolve();

                };


            transaction.onerror =
                () => {

                    reject(
                        transaction.error
                    );

                };

        }
    );

}


/* =========================================================
   GET CACHED PDF
   ========================================================= */

async function getCachedPDF() {

    const db =
        await openDB();


    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const request =
                store.get(PDF_URL);


            request.onsuccess =
                () => {

                    resolve(
                        request.result || null
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =========================================================
   CACHE CHECK
   ========================================================= */

function isCached() {

    return (
        localStorage.getItem(
            CACHE_KEY
        ) === CACHE_VERSION
    );

}


/* =========================================================
   MARK CACHE
   ========================================================= */

function markCached() {

    localStorage.setItem(
        CACHE_KEY,
        CACHE_VERSION
    );

}


/* =========================================================
   DOWNLOAD PDF
   ========================================================= */

async function downloadPDF() {


    loaderText.textContent =
        "Downloading presentation…";


    progressText.textContent =
        "Downloading the complete PDF…";


    progressBar.style.width =
        "0%";


    /*
       Fetch the LOCAL PDF.
    */

    const response =
        await fetch(
            PDF_URL,
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "slide.pdf could not be loaded. HTTP status: "
            + response.status
        );

    }


    /*
       Check Content-Length.
    */

    const total =
        Number(
            response.headers.get(
                "Content-Length"
            )
        ) || 0;


    /*
       Some servers don't provide
       a readable response body.
    */

    if (!response.body) {

        const blob =
            await response.blob();


        await savePDF(blob);

        markCached();

        progressBar.style.width =
            "100%";

        return blob;
    }


    /*
       Stream the PDF.
    */

    const reader =
        response.body.getReader();


    const chunks = [];


    let received = 0;


    while (true) {

        const {
            done,
            value
        } = await reader.read();


        if (done) {

            break;

        }


        chunks.push(value);


        received +=
            value.length;


        /*
           Show real progress
           when Content-Length exists.
        */

        if (total > 0) {

            const percent =
                Math.round(
                    (received / total) * 100
                );


            progressBar.style.width =
                percent + "%";


            progressText.textContent =
                percent + "% downloaded";

        } else {

            /*
               Unknown total size.
            */

            progressText.textContent =
                "Downloading… "
                + Math.round(
                    received / 1024
                )
                + " KB";

        }

    }


    /*
       Create final PDF Blob.
    */

    const blob =
        new Blob(
            chunks,
            {
                type: "application/pdf"
            }
        );


    progressBar.style.width =
        "100%";


    progressText.textContent =
        "Download complete.";


    /*
       Save permanently.
    */

    await savePDF(blob);


    markCached();


    return blob;

}


/* =========================================================
   GET PDF
   ========================================================= */

async function getPDF() {


    /*
       FIRST:

       Check IndexedDB.
    */

    if (isCached()) {

        loaderText.textContent =
            "Loading saved presentation…";


        progressText.textContent =
            "Using the saved PDF…";


        const cached =
            await getCachedPDF();


        if (cached) {

            progressBar.style.width =
                "100%";


            return cached;

        }

    }


    /*
       No valid cache.

       Download it completely.
    */

    return await downloadPDF();

}


/* =========================================================
   SLIDES ARRAY
   ========================================================= */

const slides = [];


/* =========================================================
   PREPARE PRESENTATION
   ========================================================= */

async function preparePresentation(
    pdfBlob
) {


    loaderText.textContent =
        "Preparing presentation…";


    progressText.textContent =
        "Opening PDF…";


    /*
       Convert Blob to ArrayBuffer.

       PDF.js will work entirely from
       this local memory copy.
    */

    const arrayBuffer =
        await pdfBlob.arrayBuffer();


    /*
       IMPORTANT:

       data: arrayBuffer

       means PDF.js does NOT need to
       fetch the PDF again.
    */

    const pdf =
        await pdfjsLib
            .getDocument({
                data: arrayBuffer
            })
            .promise;


    /*
       First slide is b.png.
    */

    slides.push(
        firstSlide
    );


    /*
       Render EVERY PDF page.

       Nothing is shown until
       this entire loop finishes.
    */

    for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
    ) {


        progressText.textContent =
            "Preparing slide "
            + pageNumber
            + " of "
            + pdf.numPages
            + "…";


        /*
           Progress of rendering.
        */

        const renderPercent =
            Math.round(
                (pageNumber /
                 pdf.numPages) * 100
            );


        progressBar.style.width =
            renderPercent + "%";


        /*
           Get PDF page.
        */

        const page =
            await pdf.getPage(
                pageNumber
            );


        /*
           Original viewport.
        */

        const baseViewport =
            page.getViewport({
                scale: 1
            });


        /*
           Render resolution.

           1280 minimum gives decent quality
           on mobile and desktop.
        */

        const targetWidth =
            Math.max(
                window.innerWidth,
                1280
            );


        const scale =
            targetWidth /
            baseViewport.width;


        const viewport =
            page.getViewport({
                scale: scale
            });


        /*
           Canvas.
        */

        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.className =
            "slide";


        canvas.width =
            Math.ceil(
                viewport.width
            );


        canvas.height =
            Math.ceil(
                viewport.height
            );


        canvas.style.maxWidth =
            "100vw";


        canvas.style.maxHeight =
            "100vh";


        canvas.style.width =
            "auto";


        canvas.style.height =
            "auto";


        /*
           Add canvas to page.
        */

        slideArea.appendChild(
            canvas
        );


        /*
           Canvas rendering context.
        */

        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        /*
           Render.
        */

        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        /*
           Store slide.
        */

        slides.push(
            canvas
        );

    }


    /*
       Everything is ready.
    */

    progressBar.style.width =
        "100%";


    progressText.textContent =
        slides.length
        + " slides ready.";


    /*
       Tiny delay so the user can
       actually see the completed state.
    */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                350
            )
    );

}


/* =========================================================
   CURRENT SLIDE
   ========================================================= */

let currentSlide = 0;


/* =========================================================
   SHOW SLIDE
   ========================================================= */

function showSlide(index) {


    if (index < 0) {

        index = 0;

    }


    if (
        index >= slides.length
    ) {

        index =
            slides.length - 1;

    }


    /*
       Hide every slide.
    */

    slides.forEach(
        slide => {

            slide.classList.remove(
                "active"
            );

        }
    );


    /*
       Show requested slide.
    */

    slides[index].classList.add(
        "active"
    );


    currentSlide =
        index;


    /*
       Counter.
    */

    counter.textContent =
        (currentSlide + 1)
        + " / "
        + slides.length;


    /*
       Button opacity.
    */

    prevButton.style.opacity =
        currentSlide === 0
            ? ".12"
            : ".55";


    nextButton.style.opacity =
        currentSlide ===
        slides.length - 1
            ? ".12"
            : ".55";

}


/* =========================================================
   NEXT
   ========================================================= */

function nextSlide() {

    if (
        currentSlide <
        slides.length - 1
    ) {

        showSlide(
            currentSlide + 1
        );

    }

}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousSlide() {

    if (
        currentSlide > 0
    ) {

        showSlide(
            currentSlide - 1
        );

    }

}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

nextButton.addEventListener(
    "click",
    nextSlide
);


prevButton.addEventListener(
    "click",
    previousSlide
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "ArrowRight" ||
            event.key === "PageDown" ||
            event.key === " "
        ) {

            event.preventDefault();

            nextSlide();

        }


        else if (
            event.key === "ArrowLeft" ||
            event.key === "PageUp"
        ) {

            event.preventDefault();

            previousSlide();

        }


        else if (
            event.key === "Home"
        ) {

            showSlide(0);

        }


        else if (
            event.key === "End"
        ) {

            showSlide(
                slides.length - 1
            );

        }


        else if (
            event.key === "f" ||
            event.key === "F"
        ) {

            enterFullscreen();

        }

    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

async function enterFullscreen() {

    try {


        if (
            !document.fullscreenElement
        ) {

            await document.documentElement
                .requestFullscreen();

        }


        else {

            await document.exitFullscreen();

        }


    }

    catch (error) {

        console.log(
            "Fullscreen unavailable:",
            error
        );

    }

}


fullscreenButton.addEventListener(
    "click",
    enterFullscreen
);


/* =========================================================
   TOUCH SWIPE
   ========================================================= */

let touchStartX = 0;

let touchStartY = 0;


slideArea.addEventListener(
    "touchstart",
    event => {


        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.screenX;


        touchStartY =
            touch.screenY;

    },
    {
        passive: true
    }
);


slideArea.addEventListener(
    "touchend",
    event => {


        const touch =
            event.changedTouches[0];


        const deltaX =
            touch.screenX -
            touchStartX;


        const deltaY =
            touch.screenY -
            touchStartY;


        /*
           Ignore small movements.
        */

        if (
            Math.abs(deltaX) < 50
        ) {

            return;

        }


        /*
           Ignore mostly vertical swipes.
        */

        if (
            Math.abs(deltaX) <
            Math.abs(deltaY)
        ) {

            return;

        }


        if (deltaX < 0) {

            nextSlide();

        }

        else {

            previousSlide();

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   START
   ========================================================= */

async function start() {

    try {


        /*
         * STEP 1
         *
         * Get PDF from IndexedDB,
         * or download it completely.
         */

        const pdfBlob =
            await getPDF();


        /*
         * STEP 2
         *
         * Render every page.
         */

        await preparePresentation(
            pdfBlob
        );


        /*
         * STEP 3
         *
         * Everything is ready.
         *
         * Only NOW hide loader.
         */

        loader.style.display =
            "none";


        presentation.style.display =
            "flex";


        /*
         * STEP 4
         *
         * Show b.png.
         */

        showSlide(0);


    }

    catch (error) {


        console.error(
            "Presentation error:",
            error
        );


        /*
           Keep presentation hidden.
        */

        presentation.style.display =
            "none";


        /*
           Show useful error.
        */

        loaderText.textContent =
            "Unable to load presentation";


        progressBar.style.width =
            "0%";


        progressText.textContent =
            "Something went wrong while loading the PDF.";


        errorBox.style.display =
            "block";


        /*
           Helpful debugging message.
        */

        errorBox.innerHTML =
            "File expected at: <b>./slide.pdf</b><br><br>"
            +
            "Make sure <b>slide.pdf</b> is inside the same "
            +
            "folder as this index.html file.<br><br>"
            +
            "Error: "
            +
            String(
                error.message ||
                error
            );

    }

}


/* =========================================================
   RUN
   ========================================================= */

start();

</script>

</body>
</html>
