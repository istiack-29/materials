<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Presentation">
<meta property="og:description" content="Presentation slides">
<meta property="og:image" content="b.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="675">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Presentation</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
    }

    /* =========================
       LOADING SCREEN
       ========================= */

    #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        color: white;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-align: center;
    }

    #loaderText {
        font-size: clamp(18px, 3vw, 32px);
        margin-bottom: 20px;
    }

    #progress {
        width: min(500px, 75vw);
        height: 7px;
        background: #333;
        border-radius: 20px;
        overflow: hidden;
    }

    #progressBar {
        width: 0%;
        height: 100%;
        background: white;
        transition: width .15s linear;
    }

    #progressText {
        margin-top: 12px;
        color: #aaa;
        font-size: 14px;
    }

    /* =========================
       PRESENTATION
       ========================= */

    #presentation {
        position: fixed;
        inset: 0;
        background: #000;

        display: none;
        align-items: center;
        justify-content: center;
    }

    #slideArea {
        position: relative;

        width: 100vw;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #000;
    }

    .slide {
        position: absolute;

        max-width: 100vw;
        max-height: 100vh;

        width: auto;
        height: auto;

        object-fit: contain;

        display: none;

        user-select: none;
        -webkit-user-drag: none;
    }

    .slide.active {
        display: block;
    }

    /* PDF canvases */
    canvas.slide {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* =========================
       CONTROLS
       ========================= */

    .navButton {
        position: fixed;
        bottom: 20px;

        width: 54px;
        height: 54px;

        border: none;
        border-radius: 50%;

        background: rgba(255,255,255,.18);
        color: white;

        font-size: 30px;
        line-height: 54px;

        cursor: pointer;

        z-index: 100;

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);

        opacity: .55;

        transition:
            opacity .2s,
            background .2s,
            transform .1s;
    }

    .navButton:hover {
        opacity: 1;
        background: rgba(255,255,255,.3);
    }

    .navButton:active {
        transform: scale(.9);
    }

    #prev {
        left: 20px;
    }

    #next {
        right: 20px;
    }

    #fullscreen {
        position: fixed;
        top: 15px;
        right: 15px;

        width: 42px;
        height: 42px;

        border: none;
        border-radius: 50%;

        background: rgba(255,255,255,.15);
        color: white;

        font-size: 20px;

        cursor: pointer;
        z-index: 100;

        opacity: .45;
    }

    #fullscreen:hover {
        opacity: 1;
    }

    #counter {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);

        color: rgba(255,255,255,.6);

        font-size: 12px;

        z-index: 100;

        pointer-events: none;
    }

    /* =========================
       LANDSCAPE WARNING
       ========================= */

    #rotateWarning {
        position: fixed;
        inset: 0;

        background: #000;
        color: white;

        z-index: 10000;

        display: none;

        align-items: center;
        justify-content: center;

        text-align: center;

        padding: 30px;
    }

    #rotateWarning .box {
        max-width: 500px;
    }

    #rotateIcon {
        font-size: 70px;
        margin-bottom: 20px;
    }

    #rotateWarning h2 {
        margin: 0 0 10px;
        font-size: 26px;
    }

    #rotateWarning p {
        color: #aaa;
        line-height: 1.5;
    }

    /*
       Portrait = width <= height
       We don't show the presentation in portrait.
    */
    @media (orientation: portrait) {
        #presentation {
            display: none !important;
        }

        #rotateWarning {
            display: flex;
        }
    }

    @media (orientation: landscape) {
        #rotateWarning {
            display: none !important;
        }
    }

    /*
       On very small screens, controls become smaller.
    */
    @media (max-height: 500px) {
        .navButton {
            width: 42px;
            height: 42px;
            line-height: 42px;
            font-size: 23px;
            bottom: 10px;
        }

        #prev {
            left: 10px;
        }

        #next {
            right: 10px;
        }
    }
</style>
</head>

<body>

<!-- =========================
     LOADING SCREEN
     ========================= -->

<div id="loader">

    <div id="loaderText">
        Loading presentation…
    </div>

    <div id="progress">
        <div id="progressBar"></div>
    </div>

    <div id="progressText">
        Please wait. The presentation is being prepared.
    </div>

</div>


<!-- =========================
     ROTATE WARNING
     ========================= -->

<div id="rotateWarning">

    <div class="box">

        <div id="rotateIcon">⟳</div>

        <h2>Landscape mode required</h2>

        <p>
            Please rotate your device to landscape mode.
            This presentation is designed for 16:9 screens,
            laptops, PCs and smartboards.
        </p>

    </div>

</div>


<!-- =========================
     PRESENTATION
     ========================= -->

<div id="presentation">

    <div id="slideArea">

        <!-- Slide 1 -->
        <img
            id="firstSlide"
            class="slide"
            src="b.png"
            alt="Presentation cover"
            draggable="false"
        >

        <!-- PDF slides are inserted here -->

    </div>

    <button
        id="prev"
        class="navButton"
        aria-label="Previous slide">
        ‹
    </button>

    <button
        id="next"
        class="navButton"
        aria-label="Next slide">
        ›
    </button>

    <button
        id="fullscreen"
        aria-label="Fullscreen">
        ⛶
    </button>

    <div id="counter"></div>

</div>


<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module"></script>


<script type="module">

/* ============================================================
   CONFIGURATION
   ============================================================ */

const PDF_URL = "https://github.com/istiack-29/materials/public-speaking-mastery/slide/slide.pdf";

const COVER_URL = "b.png";

const DB_NAME = "PresentationCache";
const DB_VERSION = 1;
const STORE_NAME = "files";

const CACHE_KEY = "presentation_pdf_cached";
const CACHE_VERSION = "presentation_v1";


/* ============================================================
   ELEMENTS
   ============================================================ */

const loader = document.getElementById("loader");
const loaderText = document.getElementById("loaderText");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

const presentation = document.getElementById("presentation");
const slideArea = document.getElementById("slideArea");

const firstSlide = document.getElementById("firstSlide");

const prevButton = document.getElementById("prev");
const nextButton = document.getElementById("next");
const fullscreenButton = document.getElementById("fullscreen");
const counter = document.getElementById("counter");


/* ============================================================
   PDF.JS
   ============================================================ */

const pdfjsLib = await import(
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
);

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* ============================================================
   INDEXED DB
   ============================================================ */

function openDB() {

    return new Promise((resolve, reject) => {

        const request = indexedDB.open(
            DB_NAME,
            DB_VERSION
        );

        request.onupgradeneeded = () => {

            const db = request.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }

        };

        request.onsuccess = () => {
            resolve(request.result);
        };

        request.onerror = () => {
            reject(request.error);
        };

    });

}


async function savePDF(blob) {

    const db = await openDB();

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_NAME, "readwrite");

        const store =
            transaction.objectStore(STORE_NAME);

        store.put(blob, PDF_URL);

        transaction.oncomplete = () => {
            resolve();
        };

        transaction.onerror = () => {
            reject(transaction.error);
        };

    });

}


async function getCachedPDF() {

    const db = await openDB();

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_NAME, "readonly");

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.get(PDF_URL);

        request.onsuccess = () => {
            resolve(request.result || null);
        };

        request.onerror = () => {
            reject(request.error);
        };

    });

}


/* ============================================================
   LOCAL STORAGE
   ============================================================ */

function isCached() {

    return (
        localStorage.getItem(CACHE_KEY)
        === CACHE_VERSION
    );

}


function markCached() {

    localStorage.setItem(
        CACHE_KEY,
        CACHE_VERSION
    );

}


/* ============================================================
   DOWNLOAD PDF
   ============================================================ */

async function downloadPDF() {

    loaderText.textContent =
        "Downloading presentation…";

    progressText.textContent =
        "Loading the complete PDF before starting.";

    const response = await fetch(PDF_URL, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            "Could not load slide.pdf"
        );
    }

    const total =
        Number(response.headers.get("Content-Length")) || 0;

    if (!response.body) {

        const blob =
            await response.blob();

        await savePDF(blob);

        markCached();

        return blob;
    }

    const reader =
        response.body.getReader();

    const chunks = [];

    let received = 0;

    while (true) {

        const {
            done,
            value
        } = await reader.read();

        if (done) break;

        chunks.push(value);

        received += value.length;

        if (total > 0) {

            const percent =
                Math.round(
                    received / total * 100
                );

            progressBar.style.width =
                percent + "%";

            progressText.textContent =
                `${percent}% loaded`;
        }

    }

    const blob =
        new Blob(chunks, {
            type: "application/pdf"
        });

    progressBar.style.width = "100%";

    progressText.textContent =
        "Download complete. Preparing slides…";

    await savePDF(blob);

    markCached();

    return blob;
}


/* ============================================================
   GET PDF
   ============================================================ */

async function loadPDFFile() {

    /*
       First check our persistent cache.
    */

    if (isCached()) {

        loaderText.textContent =
            "Loading saved presentation…";

        progressText.textContent =
            "Using the previously downloaded PDF.";

        const cached =
            await getCachedPDF();

        if (cached) {

            progressBar.style.width =
                "100%";

            return cached;
        }

    }

    /*
       No usable cache → download everything.
    */

    return await downloadPDF();
}


/* ============================================================
   RENDER ALL PDF PAGES
   ============================================================ */

const slides = [];

async function preparePresentation(pdfBlob) {

    loaderText.textContent =
        "Preparing slides…";

    progressText.textContent =
        "The complete PDF is loaded. Rendering slides…";

    const arrayBuffer =
        await pdfBlob.arrayBuffer();

    /*
       PDF.js gets the complete PDF from memory.
       No network request is needed while presenting.
    */

    const pdf =
        await pdfjsLib.getDocument({
            data: arrayBuffer
        }).promise;

    /*
       First slide is b.png.
    */

    slides.push(firstSlide);

    /*
       Create ALL PDF canvases before showing
       the presentation.
    */

    for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
    ) {

        progressText.textContent =
            `Preparing slide ${pageNumber} of ${pdf.numPages}…`;

        const page =
            await pdf.getPage(pageNumber);

        /*
           Render at a good resolution.

           16:9 presentations generally look good
           at 1.5–2x CSS resolution.
        */

        const baseViewport =
            page.getViewport({
                scale: 1
            });

        const targetWidth =
            Math.max(
                window.innerWidth,
                1280
            );

        const scale =
            targetWidth /
            baseViewport.width;

        const viewport =
            page.getViewport({
                scale
            });

        const canvas =
            document.createElement("canvas");

        canvas.className = "slide";

        canvas.width =
            Math.ceil(viewport.width);

        canvas.height =
            Math.ceil(viewport.height);

        canvas.style.maxWidth =
            "100vw";

        canvas.style.maxHeight =
            "100vh";

        canvas.style.width =
            "auto";

        canvas.style.height =
            "auto";

        slideArea.appendChild(canvas);

        const context =
            canvas.getContext("2d", {
                alpha: false
            });

        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;

        slides.push(canvas);
    }

    /*
       EVERYTHING is now prepared.
       Only now can the presentation start.
    */

    progressBar.style.width = "100%";

    progressText.textContent =
        `${slides.length} slides ready.`;

    await new Promise(
        resolve => setTimeout(resolve, 300)
    );
}


/* ============================================================
   SLIDE NAVIGATION
   ============================================================ */

let currentSlide = 0;


function showSlide(index) {

    if (index < 0) {
        index = 0;
    }

    if (index >= slides.length) {
        index = slides.length - 1;
    }

    slides.forEach(
        slide => slide.classList.remove("active")
    );

    slides[index].classList.add("active");

    currentSlide = index;

    counter.textContent =
        `${currentSlide + 1} / ${slides.length}`;

    /*
       Disable buttons at beginning/end.
    */

    prevButton.style.opacity =
        currentSlide === 0 ? ".15" : ".55";

    nextButton.style.opacity =
        currentSlide === slides.length - 1
            ? ".15"
            : ".55";
}


function nextSlide() {

    if (currentSlide < slides.length - 1) {
        showSlide(currentSlide + 1);
    }

}


function previousSlide() {

    if (currentSlide > 0) {
        showSlide(currentSlide - 1);
    }

}


/* ============================================================
   BUTTONS
   ============================================================ */

nextButton.addEventListener(
    "click",
    nextSlide
);

prevButton.addEventListener(
    "click",
    previousSlide
);


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowRight" ||
            event.key === "PageDown" ||
            event.key === " "
        ) {

            event.preventDefault();
            nextSlide();

        }

        else if (
            event.key === "ArrowLeft" ||
            event.key === "PageUp"
        ) {

            event.preventDefault();
            previousSlide();

        }

        else if (
            event.key === "Home"
        ) {

            showSlide(0);

        }

        else if (
            event.key === "End"
        ) {

            showSlide(slides.length - 1);

        }

        else if (
            event.key === "f" ||
            event.key === "F"
        ) {

            enterFullscreen();

        }

    }
);


/* ============================================================
   FULLSCREEN
   ============================================================ */

async function enterFullscreen() {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();

        } else {

            await document.exitFullscreen();

        }

    } catch (error) {

        console.log(
            "Fullscreen unavailable:",
            error
        );

    }

}


fullscreenButton.addEventListener(
    "click",
    enterFullscreen
);


/* ============================================================
   TOUCH / SWIPE
   ============================================================ */

let touchStartX = 0;
let touchStartY = 0;

slideArea.addEventListener(
    "touchstart",
    event => {

        const touch =
            event.changedTouches[0];

        touchStartX =
            touch.screenX;

        touchStartY =
            touch.screenY;

    },
    { passive: true }
);


slideArea.addEventListener(
    "touchend",
    event => {

        const touch =
            event.changedTouches[0];

        const deltaX =
            touch.screenX - touchStartX;

        const deltaY =
            touch.screenY - touchStartY;

        /*
           Ignore vertical swipes.
        */

        if (
            Math.abs(deltaX) < 50 ||
            Math.abs(deltaX) < Math.abs(deltaY)
        ) {
            return;
        }

        if (deltaX < 0) {
            nextSlide();
        } else {
            previousSlide();
        }

    },
    { passive: true }
);


/* ============================================================
   START PRESENTATION
   ============================================================ */

async function start() {

    try {

        /*
           1. Load the COMPLETE PDF.
           2. Cache it.
           3. Render EVERY page.
           4. Only THEN show presentation.
        */

        const pdfBlob =
            await loadPDFFile();

        await preparePresentation(
            pdfBlob
        );

        /*
           Make presentation visible only after
           everything is ready.
        */

        loader.style.display = "none";

        presentation.style.display =
            "flex";

        /*
           Slide 1 = b.png
        */

        showSlide(0);

    } catch (error) {

        console.error(error);

        loaderText.textContent =
            "Unable to load presentation";

        progressText.textContent =
            error.message ||
            "Please check that slide.pdf and b.png exist.";

        progressBar.style.width =
            "0%";
    }

}


/* ============================================================
   START
   ============================================================ */

start();

</script>

</body>
</html>
